version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:20"
      timezone: "Europe/Madrid"
    rebase-strategy: "disabled"
    assignees:
      - "ClaudiodelaRiva"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "java"
      - "E2E"

  # SUT backend (Spring Boot).
  #
  # openvidu-java-client is grouped on its own (see below) because it is one of
  # three OpenVidu pieces that must be kept in step with each other, and Dependabot
  # cannot express that: it has no visibility into openvidu-browser (a different
  # ecosystem - npm, tracked further down) or into openvidu-server-kms (not a
  # dependency file at all - it's a Docker image tag interpolated from the
  # MEDIASERVER env var in docker-compose.yml, set per-TJob in
  # .retorch/envfiles/*.env and in the repo-root local.env). Grouping still helps:
  # it gives openvidu-java-client its own dedicated, clearly-named PR
  # ("Bump the openvidu group in /sut with N updates") so it's easy to spot
  # alongside the matching npm-side "openvidu" group PR and reconcile by hand.
  #
  # When either PR lands, check/update the other two by hand:
  #   - openvidu-java-client (here) <-> openvidu-browser (npm entry below):
  #     keep on the same version - these are the two client SDKs and drift between
  #     them breaks at runtime even when both sides compile cleanly (confirmed:
  #     openvidu-browser alone jumping 2.3.0 -> 2.32.2 passed its own build but broke
  #     the chat/video E2E tests against a mismatched server).
  #   - openvidu-server-kms (MEDIASERVER in docker-compose.yml / .retorch/envfiles/
  #     *.env / local.env): the self-hosted Docker image's last published tag is
  #     2.23.0 (confirmed against Docker Hub - there is no newer one, even though
  #     openvidu-browser/openvidu-java-client keep releasing past it). So the
  #     client SDKs cannot always match the server's version exactly going
  #     forward; when they can't, pin the server to its latest available tag
  #     (2.23.0 or whatever supersedes it) and confirm the E2E video/chat tests
  #     still pass against that gap before merging - don't assume it silently works.
  - package-ecosystem: maven
    directory: "/sut"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:20"
      timezone: "Europe/Madrid"
    rebase-strategy: "disabled"
    assignees:
      - "ClaudiodelaRiva"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "java"
      - "SUT"
    groups:
      openvidu:
        patterns:
          - "io.openvidu:openvidu-java-client"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:20"
      timezone: "Europe/Madrid"
    rebase-strategy: "disabled"
    assignees:
      - "ClaudiodelaRiva"
    open-pull-requests-limit: 20

  - package-ecosystem: npm
    directory: "/sut/src/main/angular"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:20"
      timezone: "Europe/Madrid"
    rebase-strategy: "disabled"
    assignees:
      - "ClaudiodelaRiva"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "javascript"
      - "SUT"
    groups:
      # Angular requires every @angular/* and @angular-devkit/* package to stay on the
      # same major version in lockstep - ungrouped, a partial bump breaks the build
      # (e.g. @angular-devkit/build-angular alone jumping a major over @angular/core,
      # or vice versa). angular-calendar is included too: it's a third-party package
      # (outside the @angular/* scope, so an "@angular/*" glob would miss it) whose
      # major versions track a minimum @angular/core peer version - bumping core to
      # Angular 22 without it breaks the build (angular-calendar <0.32 imports
      # ComponentFactoryResolver, which Angular 22 removed). Its own transitive
      # peers (angular-draggable-droppable, angular-resizable-element) aren't listed
      # here since they aren't direct package.json dependencies - bumping
      # angular-calendar itself pulls in compatible versions of those automatically.
      #
      # Listed explicitly (not just "@angular/*") because Dependabot's grouping is
      # best-effort, not atomic: it has already left individual family members (e.g.
      # @angular/animations, @angular/platform-browser-dynamic,
      # @angular-devkit/build-angular) out of a grouped update it created for the
      # rest, and separately opened angular-calendar's own bump as an entirely
      # unrelated PR instead of folding it into this group. Explicit names remove any
      # glob-matching ambiguity, but they can't force Dependabot to resolve every
      # member in the same run - that residual gap is closed by CI: a straggler
      # produces a version-mismatch build failure that must be fixed (bump the
      # straggler to match) before merging, same as this one was.
      angular:
        patterns:
          - "@angular/animations"
          - "@angular/cdk"
          - "@angular/cli"
          - "@angular/common"
          - "@angular/compiler"
          - "@angular/compiler-cli"
          - "@angular/core"
          - "@angular/forms"
          - "@angular/platform-browser"
          - "@angular/platform-browser-dynamic"
          - "@angular/router"
          - "@angular-devkit/build-angular"
          - "angular-calendar"
      # Isolated from the "angular" group above on purpose: openvidu-browser's
      # version is coupled to openvidu-java-client (maven, see the "/sut" entry
      # above) and to the self-hosted openvidu-server-kms Docker image, not to
      # Angular's own release train. Giving it a dedicated, matching-named
      # "openvidu" PR here makes that pairing visible instead of burying it inside
      # an unrelated dependency bump. See the "/sut" maven entry above for the full
      # cross-ecosystem coordination note (Dependabot can't group across
      # ecosystems, so this still has to be reconciled by hand).
      openvidu:
        patterns:
          - "openvidu-browser"
