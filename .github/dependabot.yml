version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:20"
      timezone: "Europe/Madrid"
    rebase-strategy: "disabled"
    assignees:
      - "ClaudiodelaRiva"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "E2E"

  # SUT backend (Spring Boot). Previously untracked: openvidu-java-client here can
  # drift arbitrarily far from the openvidu-browser version tracked below, even
  # though OpenVidu requires client/server/both-SDKs to stay in lockstep - exactly
  # the kind of mismatch that broke at runtime after openvidu-browser alone got
  # bumped from 2.3.0 to 2.32.2.
  - package-ecosystem: maven
    directory: "/sut"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:20"
      timezone: "Europe/Madrid"
    rebase-strategy: "disabled"
    assignees:
      - "ClaudiodelaRiva"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "SUT"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:20"
      timezone: "Europe/Madrid"
    rebase-strategy: "disabled"
    assignees:
      - "ClaudiodelaRiva"
    open-pull-requests-limit: 20

  - package-ecosystem: npm
    directory: "/sut/src/main/angular"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:20"
      timezone: "Europe/Madrid"
    rebase-strategy: "disabled"
    assignees:
      - "ClaudiodelaRiva"
    open-pull-requests-limit: 20
    groups:
      # Angular requires every @angular/* and @angular-devkit/* package to stay on the
      # same major version in lockstep - ungrouped, a partial bump breaks the build
      # (e.g. @angular-devkit/build-angular alone jumping a major over @angular/core,
      # or vice versa). Listed explicitly (not just "@angular/*") because Dependabot's
      # grouping is best-effort, not atomic: it has already left individual family
      # members (e.g. @angular/animations, @angular/platform-browser-dynamic,
      # @angular-devkit/build-angular) out of a grouped update it created for the rest.
      # Explicit names remove any glob-matching ambiguity, but they can't force
      # Dependabot to resolve every member in the same run - that gap is closed by CI:
      # a straggler produces a version-mismatch build failure that must be fixed
      # (bump the straggler to match) before merging, same as this one was.
      angular:
        patterns:
          - "@angular/animations"
          - "@angular/cdk"
          - "@angular/cli"
          - "@angular/common"
          - "@angular/compiler"
          - "@angular/compiler-cli"
          - "@angular/core"
          - "@angular/forms"
          - "@angular/platform-browser"
          - "@angular/platform-browser-dynamic"
          - "@angular/router"
          - "@angular-devkit/build-angular"
