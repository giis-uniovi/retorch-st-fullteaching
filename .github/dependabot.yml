version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:20"
      timezone: "Europe/Madrid"
    rebase-strategy: "disabled"
    assignees:
      - "ClaudiodelaRiva"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "java"
      - "E2E"

  # SUT backend (Spring Boot). openvidu-java-client here must stay in lockstep with
  # openvidu-browser below - a solo bump broke this at runtime before.
  - package-ecosystem: maven
    directory: "/sut"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:20"
      timezone: "Europe/Madrid"
    rebase-strategy: "disabled"
    assignees:
      - "ClaudiodelaRiva"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "java"
      - "SUT"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:20"
      timezone: "Europe/Madrid"
    rebase-strategy: "disabled"
    assignees:
      - "ClaudiodelaRiva"
    open-pull-requests-limit: 20

  - package-ecosystem: npm
    directory: "/sut/src/main/angular"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:20"
      timezone: "Europe/Madrid"
    rebase-strategy: "disabled"
    assignees:
      - "ClaudiodelaRiva"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "javascript"
      - "SUT"
    ignore:
      # Caps typescript to what @angular/compiler-cli actually supports - grouping
      # alone let it jump past that range and broke the angular-22 bump. Raise when
      # compiler-cli's supported range grows (check its peerDependencies).
      - dependency-name: "typescript"
        versions: [">=6.1.0"]
    groups:
      # All @angular/* packages, @angular-devkit/build-angular, angular-calendar (needs
      # a min @angular/core version) and typescript (range-pinned by compiler-cli) must
      # move together - listed explicitly since grouping is best-effort and can still
      # leave a straggler; CI catches that if it happens.
      angular:
        patterns:
          - "@angular/animations"
          - "@angular/cdk"
          - "@angular/cli"
          - "@angular/common"
          - "@angular/compiler"
          - "@angular/compiler-cli"
          - "@angular/core"
          - "@angular/forms"
          - "@angular/platform-browser"
          - "@angular/platform-browser-dynamic"
          - "@angular/router"
          - "@angular-devkit/build-angular"
          - "angular-calendar"
          - "typescript"
