version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:20"
      timezone: "Europe/Madrid"
    rebase-strategy: "disabled"
    assignees:
      - "ClaudiodelaRiva"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "java"
      - "E2E"

  # SUT backend (Spring Boot). Previously untracked: openvidu-java-client here can
  # drift arbitrarily far from the openvidu-browser version tracked below, even
  # though OpenVidu requires client/server/both-SDKs to stay in lockstep - exactly
  # the kind of mismatch that broke at runtime after openvidu-browser alone got
  # bumped from 2.3.0 to 2.32.2.
  - package-ecosystem: maven
    directory: "/sut"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:20"
      timezone: "Europe/Madrid"
    rebase-strategy: "disabled"
    assignees:
      - "ClaudiodelaRiva"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "java"
      - "SUT"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:20"
      timezone: "Europe/Madrid"
    rebase-strategy: "disabled"
    assignees:
      - "ClaudiodelaRiva"
    open-pull-requests-limit: 20

  - package-ecosystem: npm
    directory: "/sut/src/main/angular"
    schedule:
      interval: weekly
      day: "friday"
      time: "00:20"
      timezone: "Europe/Madrid"
    rebase-strategy: "disabled"
    assignees:
      - "ClaudiodelaRiva"
    open-pull-requests-limit: 20
    labels:
      - "dependencies"
      - "javascript"
      - "SUT"
    groups:
      # Angular requires every @angular/* and @angular-devkit/* package to stay on the
      # same major version in lockstep - ungrouped, a partial bump breaks the build
      # (e.g. @angular-devkit/build-angular alone jumping a major over @angular/core,
      # or vice versa). Two more packages are pinned to Angular's own release train
      # too, and would be invisible to an "@angular/*" glob:
      #   - angular-calendar: its major versions track a minimum @angular/core peer
      #     version - bumping core to Angular 22 without it breaks the build
      #     (angular-calendar <0.32 imports ComponentFactoryResolver, which
      #     Angular 22 removed). Its own transitive peers (angular-draggable-droppable,
      #     angular-resizable-element) aren't listed here since they aren't direct
      #     package.json dependencies - bumping angular-calendar itself pulls in
      #     compatible versions of those automatically.
      #   - typescript: @angular/compiler-cli pins an exact supported TS range per
      #     Angular release (e.g. Angular 21.2.17 declares ">=5.9 <6.1"). Bumping
      #     typescript alone past that range crashes the Angular CLI outright
      #     ("Cannot read properties of undefined (reading 'Error')" from `ng build`)
      #     rather than failing more legibly.
      #
      # Both are included explicitly (not just "@angular/*") because Dependabot's
      # grouping is best-effort, not atomic: it has already left individual family
      # members (e.g. @angular/animations, @angular/platform-browser-dynamic,
      # @angular-devkit/build-angular) out of a grouped update it created for the
      # rest, and separately opened angular-calendar's own bump as an entirely
      # unrelated PR instead of folding it into this group. Explicit names remove any
      # glob-matching ambiguity, but they can't force Dependabot to resolve every
      # member in the same run - that residual gap is closed by CI: a straggler
      # produces a version-mismatch build failure that must be fixed (bump the
      # straggler to match, or hold it back to the range Angular actually supports)
      # before merging, same as this one was.
      angular:
        patterns:
          - "@angular/animations"
          - "@angular/cdk"
          - "@angular/cli"
          - "@angular/common"
          - "@angular/compiler"
          - "@angular/compiler-cli"
          - "@angular/core"
          - "@angular/forms"
          - "@angular/platform-browser"
          - "@angular/platform-browser-dynamic"
          - "@angular/router"
          - "@angular-devkit/build-angular"
          - "angular-calendar"
          - "typescript"
    # Being in the "angular" group above does not make typescript's bump stay in
    # sync with the rest of the group: the 2026-09-21 combined update grouped
    # typescript 6.0.3 -> 7.0.2 together with the Angular 21 -> 22.1.6 bump, but
    # @angular/compiler-cli and @angular-devkit/build-angular 22.1.x only accept
    # typescript ">=6.0 <6.1" as a peer - dependabot doesn't check one grouped
    # package's peerDependencies against another's version before opening the PR,
    # it just takes each package to its own latest. That broke `npm install`
    # outright (ERESOLVE) rather than failing at build time. Block major bumps of
    # typescript here; move it only by hand, once the Angular release actually
    # supports the new TS major (check @angular/compiler-cli's peerDependencies
    # for the target Angular version before bumping).
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
