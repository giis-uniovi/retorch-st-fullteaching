services:
  full-teaching-mysql:
    container_name: full-teaching-mysql-${TJOB_NAME}
    image: mysql:5.7.21
    init: true
    environment:
      - MYSQL_ROOT_PASSWORD=pass
      - MYSQL_DATABASE=full_teaching
      - MYSQL_USER=ft-root
      - MYSQL_PASSWORD=pass
    networks:
      - jenkins_network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  full-teaching-openvidu-server-kms:
    container_name: full-teaching-${TJOB_NAME}-openvidu-server-kms
    image: ${MEDIASERVER}
    init: true
    expose:
      - 4443
    environment:
      - KMS_STUN_IP=stun.l.google.com
      - KMS_STUN_PORT=19302
      - OPENVIDU_SECRET=MY_SECRET
      # OPENVIDU_PUBLICURL was the 2.3.0-era variable name. As of the 2.23.0 image
      # (now documented as openvidu/openvidu-dev, though still published under the
      # legacy openvidu-server-kms name too) it is no longer recognized - the
      # server silently falls back to its own default (DOMAIN_OR_PUBLIC_IP=localhost)
      # instead of erroring, which left Tomcat's self-signed HTTPS cert set up for
      # the wrong host and caused it to fall back to binding port 4443 as plain HTTP.
      # DOMAIN_OR_PUBLIC_IP is the current variable for this: a bare hostname (no
      # scheme, no port - HTTPS_PORT covers the port, defaulting to 4443 already).
      - DOMAIN_OR_PUBLIC_IP=full-teaching-${TJOB_NAME}-openvidu-server-kms
      # The 2.23.0 image bundles BOOT-INF/classes/application-container.properties
      # with server.ssl.enabled=false and FORCE_PLAIN_HTTP=true baked in (confirmed
      # by extracting openvidu-server.jar) - it's designed to run plain HTTP by
      # default. That breaks this app: the browser needs a secure (https/wss)
      # OpenVidu URL for WebRTC (its hostname isn't "localhost", where Chrome
      # allows the insecure-context exception), and openvidu-java-client's HTTPS
      # REST calls fail outright against a plain-HTTP Tomcat. Spring Boot env vars
      # outrank a jar's bundled properties file, so override both back on.
      - FORCE_PLAIN_HTTP=false
      - SERVER_SSL_ENABLED=true
    networks:
      - jenkins_network
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  full-teaching:
    container_name: full-teaching-${TJOB_NAME}
    # the fixed image name ensures all TJobs share the one image coi-setup.sh builds (avoiding stale/mismatched images),
    # and pull_policy: build prevents a doomed pull attempt for an image that only ever exists locally
    image: full-teaching-sut:local
    pull_policy: build
    build:
      context: ./sut
      dockerfile: Dockerfile
    init: true
    depends_on:
      full-teaching-mysql:
        condition: service_healthy
      full-teaching-openvidu-server-kms:
        condition: service_started
    expose:
      - 5000
    environment:
      - WAIT_HOSTS=full-teaching-mysql-${TJOB_NAME}:3306
      - WAIT_HOSTS_TIMEOUT=120
      - MYSQL_PORT_3306_TCP_ADDR=full-teaching-mysql-${TJOB_NAME}
      - MYSQL_PORT_3306_TCP_PORT=3306
      - MYSQL_ENV_MYSQL_DATABASE=full_teaching
      - MYSQL_ENV_MYSQL_USER=ft-root
      - MYSQL_ENV_MYSQL_PASSWORD=pass
      - server.port=5000
      - OPENVIDU_URL=https://full-teaching-${TJOB_NAME}-openvidu-server-kms:4443
      - OPENVIDU_SECRET=MY_SECRET
      - JACOCO_ENABLED=${JACOCO_ENABLED:-false}
    networks:
      - jenkins_network
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

networks:
  jenkins_network:
    external: true
